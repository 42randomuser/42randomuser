<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Stack">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="55%" stop-color="#0c0b09"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14110c"/>
      <stop offset="100%" stop-color="#0a0907"/>
    </linearGradient>
    <linearGradient id="tileHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c160c"/>
      <stop offset="100%" stop-color="#0c0a07"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5b942" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" rx="6" fill="url(#board)"/>
  <rect x="24" y="16" width="852" height="1" fill="url(#amberLine)" opacity="0.7">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- row 1 — tools -->
    <!-- C -->
    <g transform="translate(36,34)">
      <rect width="130" height="68" rx="4" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.45" stroke-width="1"/>
      <text x="65" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#f5b942">C</text>
      <text x="65" y="58" text-anchor="middle" font-size="10" fill="#b9b3a6" letter-spacing="1.5">LANGUAGE</text>
    </g>
    <!-- Shell -->
    <g transform="translate(182,34)">
      <rect width="130" height="68" rx="4" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.35" stroke-width="1"/>
      <text x="65" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#f5b942">$_</text>
      <text x="65" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f1ea">Shell</text>
    </g>
    <!-- Make -->
    <g transform="translate(328,34)">
      <rect width="130" height="68" rx="4" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.35" stroke-width="1"/>
      <text x="65" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f5b942">::</text>
      <text x="65" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f1ea">Make</text>
    </g>
    <!-- Git -->
    <g transform="translate(474,34)">
      <rect width="130" height="68" rx="4" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="65" cy="26" r="5" fill="none" stroke="#f5b942" stroke-width="1.5"/>
      <line x1="65" y1="31" x2="65" y2="44" stroke="#f5b942" stroke-width="1.5"/>
      <circle cx="65" cy="48" r="3.5" fill="#f5b942"/>
      <text x="65" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f1ea">Git</text>
    </g>
    <!-- Fedora -->
    <g transform="translate(620,34)">
      <rect width="130" height="68" rx="4" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.4" stroke-width="1"/>
      <path d="M52 22 c10 -10 28 -8 32 4 c3 9 -2 18 -12 20 c-6 1 -10 -1 -12 -4" fill="none" stroke="#f5b942" stroke-width="2" stroke-linecap="round"/>
      <circle cx="58" cy="34" r="2.5" fill="#f5b942"/>
      <text x="65" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f1ea">Fedora</text>
    </g>
    <!-- Vim -->
    <g transform="translate(766,34)">
      <rect width="98" height="68" rx="4" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.45" stroke-width="1"/>
      <text x="49" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#f5b942">vi</text>
      <text x="49" y="56" text-anchor="middle" font-size="12" fill="#b9b3a6">Vim</text>
    </g>

    <!-- row 2 — domains -->
    <!-- networking -->
    <g transform="translate(36,122)">
      <rect width="268" height="72" rx="4" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="36" cy="36" r="8" fill="none" stroke="#f5b942" stroke-width="1.3"/>
      <circle cx="64" cy="28" r="5" fill="none" stroke="#f5b942" stroke-width="1.1" opacity="0.7"/>
      <circle cx="64" cy="44" r="5" fill="none" stroke="#f5b942" stroke-width="1.1" opacity="0.7"/>
      <line x1="44" y1="33" x2="59" y2="28" stroke="#f5b942" stroke-width="1" opacity="0.8"/>
      <line x1="44" y1="39" x2="59" y2="44" stroke="#f5b942" stroke-width="1" opacity="0.8"/>
      <text x="168" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#f4f1ea" letter-spacing="1">networks</text>
      <text x="168" y="54" text-anchor="middle" font-size="11" fill="#b9b3a6" letter-spacing="1.5">NETWORKING</text>
    </g>
    <!-- forensic -->
    <g transform="translate(316,122)">
      <rect width="268" height="72" rx="4" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="40" cy="36" r="12" fill="none" stroke="#f5b942" stroke-width="1.4"/>
      <circle cx="40" cy="36" r="5" fill="none" stroke="#f5b942" stroke-width="1.1"/>
      <line x1="49" y1="45" x2="60" y2="56" stroke="#f5b942" stroke-width="2" stroke-linecap="round"/>
      <text x="168" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#f4f1ea" letter-spacing="1">forensic</text>
      <text x="168" y="54" text-anchor="middle" font-size="11" fill="#b9b3a6" letter-spacing="1.5">TRACE · ARTIFACT</text>
    </g>
    <!-- cyber — emphasized pentest / red team -->
    <g transform="translate(596,122)">
      <rect width="268" height="72" rx="4" fill="url(#tileHot)" stroke="#f5b942" stroke-opacity="0.75" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.45;0.9;0.45" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <path d="M34 48 L40 24 L46 48 Z" fill="none" stroke="#f5b942" stroke-width="1.5"/>
      <line x1="34" y1="42" x2="46" y2="42" stroke="#f5b942" stroke-width="1.2"/>
      <text x="168" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#f5b942" letter-spacing="1.5">cyber</text>
      <text x="168" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f1ea" letter-spacing="1">PENTEST · RED TEAM</text>
    </g>

    <!-- row 3 — quiet support chips -->
    <g transform="translate(36,214)">
      <rect width="200" height="40" rx="3" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.18" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" font-size="12" fill="#b9b3a6" letter-spacing="2">GDB · VALGRIND</text>
    </g>
    <g transform="translate(252,214)">
      <rect width="200" height="40" rx="3" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.18" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" font-size="12" fill="#b9b3a6" letter-spacing="2">SSH · TMUX</text>
    </g>
    <g transform="translate(468,214)">
      <rect width="200" height="40" rx="3" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.18" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" font-size="12" fill="#b9b3a6" letter-spacing="2">SOCKETS · PCAP</text>
    </g>
    <g transform="translate(684,214)">
      <rect width="180" height="40" rx="3" fill="url(#tile)" stroke="#f5b942" stroke-opacity="0.28" stroke-width="1"/>
      <text x="90" y="26" text-anchor="middle" font-size="12" fill="#f5b942" letter-spacing="3">∅ SIGNAL</text>
    </g>
  </g>

  <rect x="24" y="264" width="852" height="1" fill="url(#amberLine)" opacity="0.45"/>
</svg>
