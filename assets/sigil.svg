<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="sigil">
  <defs>
    <radialGradient id="g" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a160f"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="8" fill="url(#g)"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="#f5b942" stroke-width="1" opacity="0.35">
    <animate attributeName="r" values="34;42;34" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.55;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#f4f1ea" filter="url(#glow)">∅</text>
  <line x1="28" y1="92" x2="92" y2="28" stroke="#f5b942" stroke-width="2.2" opacity="0.85">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
