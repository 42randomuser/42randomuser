<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Silence. Signal net.">
  <!-- HUD composition — option 5 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0a0907"/>
      <stop offset="100%" stop-color="#070706"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#c8881a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5b942" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#ember)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- subtle scanlines -->
  <g stroke="#f5b942" stroke-width="0.5" opacity="0.06">
    <line x1="48" y1="70" x2="1152" y2="70"/>
    <line x1="48" y1="110" x2="1152" y2="110"/>
    <line x1="48" y1="150" x2="1152" y2="150"/>
    <line x1="48" y1="190" x2="1152" y2="190"/>
    <line x1="48" y1="230" x2="1152" y2="230"/>
    <line x1="48" y1="270" x2="1152" y2="270"/>
    <line x1="48" y1="310" x2="1152" y2="310"/>
    <line x1="48" y1="350" x2="1152" y2="350"/>
  </g>

  <!-- HUD frame / corner brackets -->
  <g fill="none" stroke="#f5b942" stroke-width="1.6" stroke-linecap="square">
    <!-- TL -->
    <path d="M40 88 V40 H96"/>
    <path d="M40 56 H56" opacity="0.55"/>
    <!-- TR -->
    <path d="M1160 88 V40 H1104"/>
    <path d="M1160 56 H1144" opacity="0.55"/>
    <!-- BL -->
    <path d="M40 332 V380 H96"/>
    <path d="M40 364 H56" opacity="0.55"/>
    <!-- BR -->
    <path d="M1160 332 V380 H1104"/>
    <path d="M1160 364 H1144" opacity="0.55"/>
  </g>

  <!-- inner bracket ticks -->
  <g stroke="#f5b942" stroke-width="1" opacity="0.35">
    <line x1="120" y1="40" x2="120" y2="52"/>
    <line x1="1080" y1="40" x2="1080" y2="52"/>
    <line x1="120" y1="380" x2="120" y2="368"/>
    <line x1="1080" y1="380" x2="1080" y2="368"/>
  </g>

  <!-- top HUD bar: coords + status -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f5b942">
    <text x="56" y="32" font-size="11" letter-spacing="1.5" opacity="0.85">SYS // ∅ PROFILE</text>
    <text x="600" y="32" text-anchor="middle" font-size="11" letter-spacing="2" opacity="0.7">LAT 00.00  ·  LON ∅.∅∅  ·  ALT —</text>
    <text x="1144" y="32" text-anchor="end" font-size="11" letter-spacing="1.5" opacity="0.85">LOCK
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- vertical scanning beam -->
  <rect x="180" y="48" width="2" height="324" fill="url(#scan)" opacity="0.8">
    <animate attributeName="x" values="180;1000;180" dur="7.5s" repeatCount="indefinite"/>
  </rect>

  <!-- center reticule + ∅ -->
  <g transform="translate(600,175)" filter="url(#soft)">
    <circle cx="0" cy="0" r="78" fill="none" stroke="#f5b942" stroke-width="1.2" opacity="0.35">
      <animate attributeName="r" values="70;86;70" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#f5b942" stroke-width="0.9" opacity="0.3" stroke-dasharray="4 7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>
    <!-- crosshair -->
    <g stroke="#f5b942" stroke-width="1" opacity="0.45">
      <line x1="-100" y1="0" x2="-62" y2="0"/>
      <line x1="62" y1="0" x2="100" y2="0"/>
      <line x1="0" y1="-100" x2="0" y2="-62"/>
      <line x1="0" y1="62" x2="0" y2="100"/>
    </g>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#f4f1ea">∅</text>
  </g>

  <!-- left panel: copy -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="64" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#f5b942" opacity="0.9">SIGNAL NET</text>
    <text x="64" y="168" font-size="34" font-weight="700" fill="#f7f4ee">Silence.</text>
    <text x="64" y="208" font-size="34" font-weight="700" fill="#f7f4ee">Signal net.</text>
    <text x="64" y="248" font-size="14" fill="#b9b3a6">A presence without a face —</text>
    <text x="64" y="270" font-size="14" fill="#b9b3a6">only the work, and the gaze.</text>
  </g>

  <!-- right panel: telemetry -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f5b942" opacity="0.75" font-size="11">
    <text x="980" y="120" letter-spacing="1">CH-01  OK</text>
    <text x="980" y="140" letter-spacing="1">CH-02  OK</text>
    <text x="980" y="160" letter-spacing="1">CH-03  ··</text>
    <text x="980" y="180" letter-spacing="1">SNR   +12</text>
    <text x="980" y="200" letter-spacing="1">MODE  RED</text>
    <rect x="978" y="214" width="140" height="1" fill="#f5b942" opacity="0.35"/>
    <text x="980" y="236" letter-spacing="1" opacity="0.9">TARGET  ∅</text>
  </g>

  <!-- domain chips: networking / forensic / cyber -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
    <rect x="64" y="300" width="118" height="28" rx="2" fill="none" stroke="#f5b942" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="123" y="318" text-anchor="middle" fill="#f4f1ea" font-weight="600" letter-spacing="0.5">networking</text>

    <rect x="194" y="300" width="100" height="28" rx="2" fill="none" stroke="#f5b942" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="244" y="318" text-anchor="middle" fill="#f4f1ea" font-weight="600" letter-spacing="0.5">forensic</text>

    <rect x="306" y="300" width="88" height="28" rx="2" fill="#f5b942">
      <animate attributeName="opacity" values="0.88;1;0.88" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="350" y="318" text-anchor="middle" fill="#0a0907" font-weight="700" letter-spacing="0.5">cyber</text>

    <rect x="406" y="300" width="128" height="28" rx="2" fill="none" stroke="#f7f4ee" stroke-opacity="0.55" stroke-width="1"/>
    <text x="470" y="318" text-anchor="middle" fill="#f7f4ee" font-weight="600" letter-spacing="0.5">pentest · red</text>
  </g>

  <!-- bottom HUD strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#f5b942" opacity="0.65">
    <line x1="48" y1="352" x2="1152" y2="352" stroke="#f5b942" stroke-width="0.8" opacity="0.35"/>
    <text x="56" y="372" letter-spacing="1.5">X:0042</text>
    <text x="140" y="372" letter-spacing="1.5">Y:∅000</text>
    <text x="230" y="372" letter-spacing="1.5">Z:—</text>
    <text x="600" y="372" text-anchor="middle" letter-spacing="2">∅ — the signal, not the name</text>
    <text x="1144" y="372" text-anchor="end" letter-spacing="1.5">FRAME 07</text>
  </g>
</svg>
