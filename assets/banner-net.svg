<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Silence. Signal net.">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="40%" stop-color="#0a0907"/>
      <stop offset="100%" stop-color="#0e0c08"/>
    </linearGradient>
    <radialGradient id="ember" cx="18%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#c8881a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember2" cx="78%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5b942" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softEye" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#ember)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="420" fill="url(#ember2)" opacity="0.85"/>

  <!-- left frequency ticks -->
  <g stroke="#f5b942" stroke-width="1" opacity="0.28">
    <line x1="36" y1="48" x2="36" y2="372"/>
    <g stroke-width="1.2">
      <line x1="28" y1="80" x2="44" y2="80"/>
      <line x1="28" y1="140" x2="44" y2="140"/>
      <line x1="28" y1="210" x2="48" y2="210"/>
      <line x1="28" y1="280" x2="44" y2="280"/>
      <line x1="28" y1="340" x2="44" y2="340"/>
    </g>
  </g>

  <!-- radar arcs from lower-left signal origin -->
  <g fill="none" stroke="#f5b942" stroke-width="1.2" transform="translate(120,360)">
    <circle r="90" opacity="0.18">
      <animate attributeName="r" values="70;110;70" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.28;0.08" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="160" opacity="0.14"/>
    <circle r="230" opacity="0.1"/>
    <circle r="300" opacity="0.07"/>
    <path d="M0 0 L210 -180" stroke-opacity="0.35" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="0;48" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- mid-band signal waveform -->
  <g transform="translate(0,188)">
    <path d="M80 40 C160 -10 220 90 300 40 S460 -20 540 40 S700 100 780 40 S940 -10 1060 40 S1140 70 1180 40"
          fill="none" stroke="url(#amber)" stroke-width="2.2" opacity="0.95">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M80 40 C160 -10 220 90 300 40 S460 -20 540 40 S700 100 780 40 S940 -10 1060 40 V80 H80 Z"
          fill="url(#waveFill)" opacity="0.45"/>
  </g>

  <!-- scanning bar across waveform -->
  <rect x="100" y="160" width="3" height="100" fill="#f5b942" opacity="0.85">
    <animate attributeName="x" values="100;1080;100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.95;0.25" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- twin gaze as nodes on the net (center-right) -->
  <g transform="translate(760,120)">
    <ellipse cx="0" cy="0" rx="38" ry="15" fill="#f5b942" filter="url(#softEye)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.65;0.3" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="28" ry="10" fill="#f5b942"/>
    <ellipse cx="0" cy="0" rx="8" ry="8" fill="#0a0907"/>
    <ellipse cx="96" cy="12" rx="38" ry="15" fill="#f5b942" filter="url(#softEye)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.65;0.3" dur="3s" begin="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="96" cy="12" rx="28" ry="10" fill="#f5b942"/>
    <ellipse cx="96" cy="12" rx="8" ry="8" fill="#0a0907"/>
    <!-- net links between gaze nodes and waveform -->
    <path d="M0 16 L48 70 L96 28" fill="none" stroke="#f5b942" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- large ∅ — upper right, different placement from previous left-stack -->
  <g transform="translate(980,95)" filter="url(#soft)" text-anchor="middle">
    <circle cx="0" cy="0" r="58" fill="none" stroke="#f5b942" stroke-width="1.3" opacity="0.4">
      <animate attributeName="r" values="50;66;50" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#f5b942" stroke-width="0.8" opacity="0.25" stroke-dasharray="3 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#f4f1ea">∅</text>
  </g>

  <!-- copy — bottom-left block -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="64" y="78" font-size="13" letter-spacing="4" fill="#f5b942" opacity="0.85">SIGNAL NET</text>
    <text x="64" y="300" font-size="38" font-weight="700" fill="#f7f4ee">Silence. Signal net.</text>
    <text x="64" y="336" font-size="16" fill="#b9b3a6">A presence without a face — only the work, and the gaze.</text>
  </g>

  <!-- chips -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
    <rect x="64" y="358" width="100" height="26" rx="2" fill="#f5b942">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="114" y="375" text-anchor="middle" font-weight="700" fill="#0a0907">signal</text>
    <rect x="176" y="358" width="100" height="26" rx="2" fill="none" stroke="#f7f4ee" stroke-width="1.2"/>
    <text x="226" y="375" text-anchor="middle" font-weight="600" fill="#f7f4ee">silence</text>
    <rect x="288" y="358" width="72" height="26" rx="2" fill="none" stroke="#f5b942" stroke-opacity="0.55" stroke-width="1"/>
    <text x="324" y="375" text-anchor="middle" font-weight="600" fill="#f5b942">∅</text>
  </g>
</svg>

